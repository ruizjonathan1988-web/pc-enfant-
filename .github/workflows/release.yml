name: Publier une version
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de la tirelire
        run: node tests/tirelire.test.js
      - name: Fabriquer l'archive
        run: |
          mkdir -p paquet/Flocon
          cp -r app installer "Installer Flocon.cmd" "Désinstaller Flocon.cmd" LISEZMOI.html "Guide Flocon.pdf" paquet/Flocon/
          cd paquet && zip -qr ../Flocon-installation.zip Flocon
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then gh release upload "$V" Flocon-installation.zip --clobber
          else gh release create "$V" Flocon-installation.zip --target "$GITHUB_SHA" --title "Flocon $V" --notes "Installation : voir le README."; fi
